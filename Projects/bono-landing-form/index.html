<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="images/favicon.png">
    <title>Bono App | Sign Up</title>
</head>

<body>
    <div class="wrapper">
        <header class="header">

            <div class="header-left">
                <a href="index.html">
                    <img class="logo" src="images/logo.svg" alt="bono">
                </a>
            </div>

            <div class="header-right">
                <ul>
                    <li><i class="fa-solid fa-envelope"></i>contact@bono.com</li>
                    <li><i class="fa-solid fa-phone"></i>(+31) 021-800-8244</li>
                    <li><i class="fab fa-twitter"></i></li>
                </ul>
            </div>

        </header>

        <main class="main-content">

            <form action="" netlify>
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea name="message" id="message" required></textarea>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn">Submit</button>
                </div>
            </form>


            <div class="text-container">
                <h1>Coming soon for every developer</h1>
                <p>Out new bono app will change the way you think about content management and will allow you to focus
                    on
                    what's really important. Use the contact form to send us your thoughts.
                </p>
            </div>

        </main>
    </div>
</body>

</html>
