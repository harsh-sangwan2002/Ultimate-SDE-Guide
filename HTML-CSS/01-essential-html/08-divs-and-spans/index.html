<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=\, initial-scale=1.0" />
  <title>HTML & CSS Sandbox</title>
</head>

<body>
  <h1>HTML & CSS Sandbox - Divs and Spans</h1>
  <!-- Header -->
  <div>
    <h1>My Website</h1>
    <ul>
      <li><a href="#home">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </div>

  <!-- Sections -->
  <div>
    <h2>Section One</h2>
    <p>This is the first paragraph in
    <div>section one.</div>
    </p>
    <p>This is the second paragraph in
      <span>section one.</span>
    </p>
  </div>

  <div>
    <h2>Section One</h2>
    <p>This is the first paragraph in
    <div>section one.</div>
    </p>
    <p>This is the second paragraph in
      <span>section one.</span>
    </p>
  </div>

</body>

</html>
