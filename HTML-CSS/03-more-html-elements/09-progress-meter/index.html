<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML & CSS Sandbox</title>
  <style>
    meter::-webkit-meter-optimum-value {
      background-color: violet;
    }
  </style>
</head>

<body>
  <h1>HTML & CSS Sandbox - Progress & Meter</h1>

  <!-- Progress -->
  <label for="file">File Progress:</label>
  <progress id="file" min="0" max="100" value="50">50%</progress>
  <br>

  <!-- Meter -->
  <label for="fuel">Fuel:</label>
  <meter id="fuel" value="70" min="0" max="100" low="30" high="90" optimal="80">50</meter>
</body>

</html>
