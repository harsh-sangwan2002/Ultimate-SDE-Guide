<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML & CSS Sandbox</title>
</head>

<body>
  <h1>HTML & CSS Sandbox - Tables</h1>
  <table>
    <colgroup>
      <col style="background-color: aqua;">
      <col style="background-color: teal;">
      <col style="background-color: darkcyan;">
    </colgroup>
    <thead>
      <tr>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email</th>
        <th colspan="2">Telephone Number</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>John</td>
        <td>Doe</td>
        <td>johndoe@gmail.com</td>
        <td>555-555-555</td>
        <td>999-999-999</td>
      </tr>
      <tr>
        <td>Jane</td>
        <td>Doe</td>
        <td>janedoe@gmail.com</td>
        <td>111-111-111</td>
        <td>222-222-222</td>
      </tr>
    </tbody>
  </table>
</body>

</html>
